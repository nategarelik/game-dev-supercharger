[project]
name = "game-dev-supercharger"
version = "1.0.0"
description = "Universal MCP plugin for professional 2D/3D Unity game development"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server", "agents", "workflows", "tools"]

[tool.setuptools.package-dir]
mcp_server = "mcp-server"
